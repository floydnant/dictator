name: macOS

# Runs the shared dictionary contract against the Swift implementation. The Windows
# workflow runs the identical vectors against the C# one. Both must be green for the two
# implementations to be considered in agreement — that pairing is the whole point.

on:
  push:
    branches: [main]
    paths: ['Sources/**', 'Tests/**', 'shared/**', 'Package.swift', '.github/workflows/macos.yml']
  pull_request:
    paths: ['Sources/**', 'Tests/**', 'shared/**', 'Package.swift', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dictionary-contract:
    name: Dictionary contract
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Package.swift declares swift-tools-version 5.10, which any current runner can
      # parse. Selecting the newest Xcode anyway keeps the SDK ahead of the manifest
      # rather than pinning a version that will age out of the image.
      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Swift version
        run: swift --version

      # Only the dictionary target is tested here: it is deliberately platform-neutral,
      # and it carries the contract that matters. The app target pulls in FluidAudio and
      # a 470 MB model download, which has no place in a contract check.
      - name: Test the dictionary target
        run: swift test --filter VectorTests

      - name: Confirm the vectors on both sides are identical
        run: |
          if ! diff -q shared/dictionary-test-vectors.json Tests/DictatorDictionaryTests/dictionary-test-vectors.json; then
            echo "::error::The Swift test copy of the vectors has drifted from shared/."
            echo "Run: cp shared/dictionary-test-vectors.json Tests/DictatorDictionaryTests/"
            exit 1
          fi
          echo "Vectors match."
